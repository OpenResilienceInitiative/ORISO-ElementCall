name: Release Element Call Image

on:
  push:
    branches:
      - "release/element-call-*"

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative
  IMAGE_NAME: element-call
  RELEASE_PREFIX: release/element-call-

jobs:
  release:
    name: validate, tag and publish release image
    if: ${{ github.event.deleted == false }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - name: Validate release branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"
          VERSION="${BRANCH#${RELEASE_PREFIX}}"

          if [[ "${BRANCH}" == "${VERSION}" ]]; then
            echo "::error::Release branch must match ${RELEASE_PREFIX}<version>, for example ${RELEASE_PREFIX}2.0.1"
            exit 1
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must be semantic version format, for example 2.0.1"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists. Choose a new version."
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "IMAGE=${REGISTRY}/${ORG}/${IMAGE_NAME}:${VERSION}" >> "${GITHUB_ENV}"

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: yarn
          node-version-file: .node-version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build full package
        run: yarn run build:full

      - name: Build, scan and publish the release image
        id: image
        uses: ./.github/actions/scanned-image
        with:
          publish: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerfile: Dockerfile.prod
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Sign and publish the image provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Verify the SLSA provenance predicate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh attestation verify
          "oci://${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}"
          --repo "${{ github.repository }}"
          --predicate-type "https://slsa.dev/provenance/v1"

      - name: Create and push release tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release Element Call v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Element Call v${{ env.VERSION }}
          generate_release_notes: true
          body: |
            Docker image:
            `${{ env.IMAGE }}`

            Source branch:
            `${{ github.ref_name }}`
