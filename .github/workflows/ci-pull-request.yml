name: CI - Pull Request

on:
  pull_request:

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: yarn
          node-version-file: .node-version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build full package
        run: yarn run build:full

      - name: Verify the image archive gate
        run: node --test scripts/ci/image-archive.test.cjs

      - name: Build and scan the standard Docker image
        uses: ./.github/actions/scanned-image

      - name: Build and scan the release Docker image
        uses: ./.github/actions/scanned-image
        with:
          dockerfile: Dockerfile.prod
          platforms: linux/amd64
