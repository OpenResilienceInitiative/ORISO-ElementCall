name: CI - Pull Request

on:
  pull_request:

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: yarn
          node-version-file: .node-version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify standalone Matrix room permissions
        run: yarn test run src/utils/matrix.test.ts

      - name: Build full package
        run: yarn run build:full

      - name: Verify the image archive gate
        run: node --test scripts/ci/image-archive.test.cjs

      - name: Build and scan the standard Docker image
        uses: ./.github/actions/scanned-image

      - name: Build and scan the release Docker image
        uses: ./.github/actions/scanned-image
        with:
          dockerfile: Dockerfile.prod
          platforms: linux/amd64

  two-party-media:
    name: Two-party media and rejoin (Chromium)
    # The locked Playwright build provides the Chromium shell for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          cache: yarn
          node-version-file: .node-version
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium --only-shell
      - name: Check version 12 call, two-way media and rejoin
        run: bash scripts/ci/run-two-party-media.sh
