name: CI - Main

on:
  push:
    branches:
      - main
      - dev
      - pre-dev

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Enable Corepack
      run: corepack enable

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        cache: yarn
        node-version-file: .node-version

    - name: Install dependencies
      run: yarn install --immutable

    - name: Build full package
      run: yarn run build:full

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.ORG }}/element-call
        tags: |
          type=sha
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
          type=raw,value=pre-dev,enable=${{ github.ref == 'refs/heads/pre-dev' }}

    - name: Build and push Docker image
      id: image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: mode=max
        sbom: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Reject fixable high or critical image vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.ORG }}/element-call@${{ steps.image.outputs.digest }}
        format: table
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: os,library
        severity: CRITICAL,HIGH

    - name: Sign and publish the image provenance attestation
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.1.0
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/element-call
        subject-digest: ${{ steps.image.outputs.digest }}
        push-to-registry: true

    - name: Record immutable release digest
      run: echo '${{ env.REGISTRY }}/${{ env.ORG }}/element-call@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
