name: CI - Main

on:
  pull_request:
    branches:
      - pre-dev
  push:
    branches:
      - main
      - dev
      - pre-dev

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

jobs:
  quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: yarn
          node-version-file: .node-version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run hardened widget-boundary tests
        run: >-
          yarn test --run
          src/orisoWidgetCapabilities.test.ts
          src/matrixSessionStorage.test.ts
          src/utils/matrix.test.ts
          src/UrlParams.test.ts
          src/e2ee/sharedKeyManagement.test.ts
          src/matryoshkaBoundary.test.ts

      - name: Run dependency boundary check
        run: yarn lint:knip

      - name: Lint the hardened widget boundary
        run: >-
          yarn eslint --max-warnings 0
          src/widget.ts
          src/orisoWidgetCapabilities.ts
          src/orisoWidgetCapabilities.test.ts
          src/matrixSessionStorage.ts
          src/matrixSessionStorage.test.ts
          src/UrlParams.ts
          src/UrlParams.test.ts
          src/utils/matrix.ts
          src/utils/matrix.test.ts
          src/e2ee/sharedKeyManagement.ts
          src/e2ee/sharedKeyManagement.test.ts
          src/ClientContext.tsx
          src/matryoshkaBoundary.test.ts

      - name: Check formatting of the hardened boundary
        run: >-
          yarn prettier -c
          src/widget.ts
          src/orisoWidgetCapabilities.ts
          src/orisoWidgetCapabilities.test.ts
          src/matrixSessionStorage.ts
          src/matrixSessionStorage.test.ts
          src/UrlParams.ts
          src/UrlParams.test.ts
          src/utils/matrix.ts
          src/utils/matrix.test.ts
          src/e2ee/sharedKeyManagement.ts
          src/e2ee/sharedKeyManagement.test.ts
          src/ClientContext.tsx
          src/matryoshkaBoundary.test.ts

      - name: Build full package
        run: yarn build:full

  publish-image:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      attestations: write
      # Required by actions/attest when it records the registry artifact.
      artifact-metadata: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: yarn
          node-version-file: .node-version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build full package
        run: yarn build:full

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/element-call
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=pre-dev,enable=${{ github.ref == 'refs/heads/pre-dev' }}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Reject fixable high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.ORG }}/element-call@${{ steps.image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Sign and publish the image provenance attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/element-call
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Verify the SLSA provenance predicate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh attestation verify
          "oci://${{ env.REGISTRY }}/${{ env.ORG }}/element-call@${{ steps.image.outputs.digest }}"
          --repo "${{ github.repository }}"
          --predicate-type "https://slsa.dev/provenance/v1"

      - name: Record immutable release digest
        run: echo '${{ env.REGISTRY }}/${{ env.ORG }}/element-call@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
