    <title>ORISO call — selection ring</title>
    <style>
      body {
        margin: 0;
        background: var(--cpd-color-bg-canvas-default);
        font-family:
          Inter,
          -apple-system,
          system-ui,
          sans-serif;
        color: var(--cpd-color-text-primary);
      }
      .plates {
        display: flex;
        flex-wrap: wrap;

      .caption {
        position: absolute;
        inset-block-start: 8px;
        inset-inline-start: 12px;
        z-index: 5;
        font:
          500 12px/1.4 Inter,
          sans-serif;
        letter-spacing: 0.3px;
        color: var(--cpd-color-text-secondary);
